<script>
(() => {
  const state = { token:'', role:'seller', data:null, cart:{}, ownerTab:'dashboard', sellerTab:'sale', sellerName:'', editingSaleId:'', editPayment:'', editNotes:'', recentSales:[], adjustments:[] };
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const money = value => `${state.data?.settings?.currency || '$'}${Number(value || 0).toFixed(2)}`;
  const productLabel = product => product.displayName || [product.name, product.variation].filter(Boolean).join(' — ');
  const sizeLabel = product => Number(product.packageSizeGrams) > 0 ? `${Number(product.packageSizeGrams)} g` : '';
  const run = (name, ...args) => new Promise((resolve, reject) => {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || error)));
    runner[name](...args);
  });
  const busy = on => $('loading').classList.toggle('hidden', !on);
  const toast = (message, error=false) => { const el=$('toast'); el.textContent=message; el.className='toast show'+(error?' error':''); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.className='toast',3200); };
  async function action(work, success) { busy(true); try { const result=await work(); if(success) toast(success); return result; } catch(error){ toast(error.message,true); throw error; } finally { busy(false); } }

  async function init() {
    try {
      const auth = await action(() => run('createPublicSellerSession'));
      state.token=auth.token; state.role='seller';
      state.data=await action(() => run('getAppBootstrap',state.token));
      state.sellerName=state.data.settings.sellers[0]||'';
      syncHeader();
      render();
    } catch(error) {
      toast('The seller workspace could not load. Please refresh.',true);
    }
  }

  function syncHeader() {
    $('businessName').textContent=state.data?.settings?.businessName||'PAL ANTOJO';
    $('roleBadge').textContent=state.role;
    $('workspaceLabel').textContent=state.role==='owner'?'Owner control center':'Seller workspace';
    $('ownerButton').classList.toggle('hidden',state.role==='owner');
    $('logoutButton').classList.toggle('hidden',state.role!=='owner');
  }

  $('ownerButton').addEventListener('click',()=>{ $('ownerModal').classList.remove('hidden'); setTimeout(()=>$('pin').focus(),50); });
  window.closeOwnerModal=()=>{ $('ownerModal').classList.add('hidden'); $('pin').value=''; };
  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const auth = await action(() => run('login', $('pin').value));
      if(auth.role!=='owner') throw new Error('Please use the owner PIN.');
      state.token=auth.token; state.role=auth.role; $('pin').value='';
      state.data = await action(() => run('getAppBootstrap', state.token));
      closeOwnerModal(); syncHeader();
      render();
    } catch (error) { toast(error.message,true); }
  });
  $('logoutButton').addEventListener('click', async () => { try { await run('logout',state.token); } catch(_){} location.reload(); });

  function render() {
    $('sellerView').classList.toggle('hidden', state.role!=='seller');
    $('ownerView').classList.toggle('hidden', state.role!=='owner');
    state.role==='seller' ? renderSeller() : renderOwner();
  }

  function optionList(values, placeholder) { return `<option value="">${esc(placeholder)}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''); }
  function renderSeller() {
    const s=state.data.settings;
    const nav=[['sale','＋','New Sale'],['inventory','◫','Inventory'],['transactions','↺','Transactions'],['adjustments','−','Stock Use'],['caja','$','Caja']];
    $('sellerView').innerHTML=`
      <nav class="seller-nav">${nav.map(x=>`<button class="${state.sellerTab===x[0]?'active':''}" onclick="showSellerTab('${x[0]}')"><span class="nav-icon">${x[1]}</span>${x[2]}</button>`).join('')}</nav>
      <div id="sellerContent"></div>`;
    if(state.sellerTab==='sale') renderCheckout();
    if(state.sellerTab==='inventory') renderSellerInventory();
    if(state.sellerTab==='transactions') renderTransactions();
    if(state.sellerTab==='adjustments') renderAdjustments();
    if(state.sellerTab==='caja') renderCaja();
  }
  window.showSellerTab=tab=>{ if(state.sellerTab==='sale'){state.editPayment=document.querySelector('input[name="payment"]:checked')?.value||'';state.editNotes=$('saleNotes')?.value||'';} state.sellerTab=tab; renderSeller(); };
  window.setSeller=value=>{ state.sellerName=value; };
  function sellerPicker(){ const s=state.data.settings.sellers; return `<div><label>Who is selling?</label><select onchange="setSeller(this.value)">${optionList(s,'Select your name').replace(`value="${esc(state.sellerName)}"`,`value="${esc(state.sellerName)}" selected`)}</select></div>`; }
  function renderCheckout(){
    const content=$('sellerContent');
    content.innerHTML=`
      ${state.editingSaleId?`<div class="editing-banner"><span>Editing ${esc(state.editingSaleId)}</span><button class="secondary" onclick="cancelEdit()">Cancel edit</button></div>`:''}
      <div class="section-head"><div class="section-copy"><p class="eyebrow">${state.editingSaleId?'CORRECT TRANSACTION':'QUICK CHECKOUT'}</p><h2>${state.editingSaleId?'Update sale':'Start a new sale'}</h2><p class="muted">Choose products, confirm payment, and complete the transaction.</p></div><div class="seller-header-tools">${sellerPicker()}</div></div>
      <div class="seller-layout"><div><div class="product-toolbar"><input id="productSearch" type="search" placeholder="Search products or flavors…" oninput="filterProducts(this.value)"></div><div class="product-grid" id="productGrid">${state.data.products.map(product=>productCard(product)).join('')||emptyState('No products available','Ask the owner to activate products and add inventory.')}</div></div>
      <aside class="card checkout"><div class="checkout-head"><h3>Order summary</h3><span class="cart-count" id="cartCount">0 bags</span></div><div id="saleSummary"></div>
      <label>Payment method</label><div class="payment-grid">${state.data.settings.paymentMethods.map((method,i)=>`<label class="payment-option"><input type="radio" name="payment" value="${esc(method)}" ${state.editPayment===method?'checked':''}><span>${esc(method)}</span></label>`).join('')}</div>
      <details><summary>Add a note</summary><textarea id="saleNotes" maxlength="500" placeholder="Customer name or useful detail…">${esc(state.editNotes)}</textarea></details>
      <button class="primary wide" id="recordSaleButton" onclick="submitSale()">${state.editingSaleId?'UPDATE TRANSACTION':'COMPLETE SALE'}</button></aside></div>
      <button class="mobile-cart-bar" type="button" onclick="scrollToCheckout()"><span><strong id="mobileCartCount">0 bags</strong>Tap to review order</span><b id="mobileCartTotal">${money(0)} →</b></button>`;
    updateSummary(); updateMobileCartBar();
  }
  function productCard(product){ const qty=state.cart[product.id]||0; return `<article class="product-card ${qty?'selected':''} ${product.available<1?'sold-out':''}" data-search="${esc((productLabel(product)+' '+sizeLabel(product)).toLowerCase())}"><span class="stock-pill ${product.available<=3?'low':''}">${product.available} left</span><h3>${esc(product.name)}</h3><div class="flavor">${esc(product.variation||'Original')} ${sizeLabel(product)?`<span class="package-size">${esc(sizeLabel(product))}</span>`:''}</div><div class="product-meta"><span class="price">${money(product.price)}</span><span>${product.available?product.available+' left':'Sold out'}</span></div><div class="qty"><button ${product.available+(state.originalCart?.[product.id]||0)<1?'disabled':''} aria-label="Remove one" onclick="changeQty('${esc(product.id)}',-1)">−</button><strong id="qty-${esc(product.id)}">${qty}</strong><button ${product.available+(state.originalCart?.[product.id]||0)<1?'disabled':''} aria-label="Add one" onclick="changeQty('${esc(product.id)}',1)">+</button></div></article>`; }
  window.filterProducts=value=>{ document.querySelectorAll('#productGrid .product-card').forEach(card=>card.classList.toggle('hidden',!card.dataset.search.includes(value.toLowerCase()))); };
  window.changeQty=(id,delta)=>{ const product=state.data.products.find(p=>p.id===id); const existing=state.cart[id]||0; const max=product.available+(state.editingSaleId?(state.originalCart?.[id]||0):0); const next=Math.max(0,Math.min(max,existing+delta)); state.cart[id]=next; const el=$(`qty-${id}`); if(el){el.textContent=next;el.closest('.product-card').classList.toggle('selected',next>0);} updateSummary(); updateMobileCartBar(); };
  function cartTotals(){ const bags=Object.values(state.cart).reduce((a,b)=>a+b,0); const subtotal=state.data.products.reduce((sum,p)=>sum+(state.cart[p.id]||0)*p.price,0); const d=state.data.settings.discounts; const rate=bags>=d.tier2Quantity?d.tier2Percent:bags>=d.tier1Quantity?d.tier1Percent:0; return {bags,subtotal,rate,discount:subtotal*rate,total:subtotal*(1-rate)}; }
  function updateMobileCartBar(){ const t=cartTotals(),count=`${t.bags} bag${t.bags===1?'':'s'}`; if($('mobileCartCount')) $('mobileCartCount').textContent=count; if($('mobileCartTotal')) $('mobileCartTotal').textContent=`${money(t.total)} →`; }
  window.scrollToCheckout=()=>document.querySelector('.checkout')?.scrollIntoView({behavior:'smooth',block:'start'});
  function updateSummary(){ const t=cartTotals(),d=state.data.settings.discounts; let msg='Add products to begin.'; if(t.bags>0&&t.bags<d.tier1Quantity) msg=`Add ${d.tier1Quantity-t.bags} more bag${d.tier1Quantity-t.bags===1?'':'s'} to unlock ${Math.round(d.tier1Percent*100)}% off.`; else if(t.bags>=d.tier1Quantity&&t.bags<d.tier2Quantity) msg=t.bags===d.tier2Quantity-1?`Add 1 more bag to unlock ${Math.round(d.tier2Percent*100)}% off.`:`${Math.round(d.tier1Percent*100)}% bundle discount applied.`; else if(t.bags>=d.tier2Quantity) msg=`${Math.round(d.tier2Percent*100)}% bundle discount applied.`; const lines=state.data.products.filter(p=>state.cart[p.id]>0).map(p=>`<div class="cart-line"><span>${esc(productLabel(p))}<small>${sizeLabel(p)?esc(sizeLabel(p))+' · ':''}${state.cart[p.id]} × ${money(p.price)}</small></span><strong>${money(state.cart[p.id]*p.price)}</strong></div>`).join(''); $('saleSummary').innerHTML=(lines?`<div class="cart-lines">${lines}</div>`:'<div class="empty-cart">Your order is empty.</div>')+`<div class="summary-row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div><div class="summary-row discount"><span>Discount (${Math.round(t.rate*100)}%)</span><strong>−${money(t.discount)}</strong></div><div class="summary-row grand-total"><span>Total</span><span>${money(t.total)}</span></div><div class="upsell">${esc(msg)}</div>`; $('cartCount').textContent=`${t.bags} bag${t.bags===1?'':'s'}`; $('recordSaleButton').disabled=!t.bags; }
  window.submitSale=async()=>{ const items=Object.keys(state.cart).filter(id=>state.cart[id]>0).map(id=>({productId:id,quantity:state.cart[id]})); const payment=document.querySelector('input[name="payment"]:checked')?.value||''; const request={seller:state.sellerName,paymentMethod:payment,notes:$('saleNotes').value,items}; try { const result=state.editingSaleId?await action(()=>run('updateSale',state.token,state.editingSaleId,request)):await action(()=>run('recordSale',state.token,request)); toast(`${result.updated?'Transaction updated':'Sale completed'} · ${money(result.finalTotal)}`); resetSale(); state.data=await action(()=>run('getAppBootstrap',state.token)); renderSeller(); } catch(_){} };
  function resetSale(){ state.cart={};state.originalCart={};state.editingSaleId='';state.editPayment='';state.editNotes=''; }
  window.cancelEdit=()=>{resetSale();renderCheckout();};

  function renderSellerInventory(){ const products=state.data.products; $('sellerContent').innerHTML=`<div class="section-head"><div class="section-copy"><p class="eyebrow">LIVE STOCK</p><h2>Product inventory</h2><p class="muted">A quick, read-only view of what is available to sell right now.</p></div><button class="secondary" onclick="refreshSeller()">Refresh</button></div><div class="inventory-grid">${products.map(p=>`<article class="card inventory-card"><h3>${esc(p.name)}</h3><div class="flavor">${esc(p.variation||'Original')} ${sizeLabel(p)?`<span class="package-size">${esc(sizeLabel(p))}</span>`:''}</div><div class="inventory-number">${p.available}</div><div class="inventory-foot"><span>bags available</span><strong>${money(p.price)} each</strong></div><div class="status-line ${p.available<=3?'low':''}"></div></article>`).join('')}</div>`; }
  window.refreshSeller=async()=>{state.data=await action(()=>run('getAppBootstrap',state.token));renderSeller();};

  async function renderTransactions(){ $('sellerContent').innerHTML=`<div class="section-head"><div class="section-copy"><p class="eyebrow">TODAY'S ACTIVITY</p><h2>Transactions</h2><p class="muted">Edit or void a sale made today. Voiding automatically returns its products to inventory.</p></div><button class="secondary" onclick="showSellerTab('transactions')">Refresh</button></div><div id="transactionList" class="transaction-list">${emptyState('Loading transactions…','')}</div>`; try{state.recentSales=await action(()=>run('getRecentSellerSales',state.token));$('transactionList').innerHTML=state.recentSales.length?state.recentSales.map(transactionCard).join(''):emptyState('No sales yet today','Completed sales will appear here.');}catch(_){} }
  function transactionCard(sale){return `<article class="card transaction-card"><div><h3>${esc(sale.saleId)}</h3><div class="transaction-meta"><span>${esc(sale.time)}</span><span>${esc(sale.seller)}</span><span>${esc(sale.paymentMethod)}</span><span>${Math.round(sale.discountPercent*100)}% discount</span></div><div class="transaction-items">${sale.items.map(i=>`${i.quantity} × ${esc(i.product)}${i.packageSizeGrams?` · ${i.packageSizeGrams} g`:''}`).join(' · ')}</div></div><div class="transaction-total"><strong>${money(sale.finalTotal)}</strong><div class="inline-actions"><button class="secondary" onclick="editSellerSale('${esc(sale.saleId)}')">Edit</button><button class="danger" onclick="requestVoid('${esc(sale.saleId)}')">Void</button></div></div></article>`; }
  window.editSellerSale=id=>{const sale=state.recentSales.find(x=>x.saleId===id);if(!sale)return;state.cart={};sale.items.forEach(i=>state.cart[i.productId]=i.quantity);state.originalCart={...state.cart};state.sellerName=sale.seller;state.editPayment=sale.paymentMethod;state.editNotes=sale.notes;state.editingSaleId=id;state.sellerTab='sale';renderSeller();};
  window.requestVoid=async id=>{if(!(await confirmAction('Void this transaction?','Its products will be returned to inventory. The transaction will remain in the audit history.')))return;try{await action(()=>run('voidSale',state.token,id),'Transaction voided. Inventory restored.');state.data=await action(()=>run('getAppBootstrap',state.token));renderTransactions();}catch(_){}};

  async function renderAdjustments(){ $('sellerContent').innerHTML=`<div class="section-head"><div class="section-copy"><p class="eyebrow">NON-SALE STOCK USE</p><h2>Samples & personal use</h2><p class="muted">Remove products from inventory without creating a sale. Every adjustment is recorded.</p></div></div><div class="adjustment-layout"><form class="card" onsubmit="submitAdjustment(event)"><h3>Record stock use</h3>${sellerPicker()}<label>Product</label><select id="adjustProduct" required><option value="">Choose a product</option>${state.data.products.map(p=>`<option value="${esc(p.id)}">${esc(productLabel(p))}${sizeLabel(p)?` · ${esc(sizeLabel(p))}`:''} · ${p.available} available</option>`).join('')}</select><label>Quantity</label><input id="adjustQty" type="number" min="1" step="1" required placeholder="Number of bags"><label>Reason</label><div class="reason-grid">${['Sample','Personal use','Damaged'].map((r,i)=>`<label class="reason-option"><input type="radio" name="reason" value="${r}" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}</div><label>Note <span class="muted">(optional)</span></label><textarea id="adjustNotes" maxlength="300" placeholder="Event, person, or explanation…"></textarea><button class="primary wide">RECORD STOCK USE</button></form><div class="card"><h3>Recent adjustments</h3><div id="adjustmentHistory" class="transaction-list">${emptyState('Loading history…','')}</div></div></div>`; try{state.adjustments=await action(()=>run('getRecentAdjustments',state.token));$('adjustmentHistory').innerHTML=state.adjustments.length?state.adjustments.slice(0,12).map(a=>`<div class="transaction-card"><div><h3>${esc(a.product)}</h3><div class="transaction-meta"><span>${esc(a.date)} ${esc(a.time)}</span><span>${esc(a.seller)}</span><span>${esc(a.reason)}</span></div>${a.notes?`<div class="transaction-items">${esc(a.notes)}</div>`:''}</div><div class="transaction-total"><strong>${a.quantity}</strong></div></div>`).join(''):emptyState('No adjustments yet','Samples and personal use will appear here.');}catch(_){} }
  window.submitAdjustment=async e=>{e.preventDefault();const request={seller:state.sellerName,productId:$('adjustProduct').value,quantity:$('adjustQty').value,reason:document.querySelector('input[name="reason"]:checked')?.value||'',notes:$('adjustNotes').value};try{const result=await action(()=>run('recordStockAdjustment',state.token,request));toast(`${result.product}: ${Math.abs(result.quantityChange)} bag${Math.abs(result.quantityChange)===1?'':'s'} recorded.`);state.data=await action(()=>run('getAppBootstrap',state.token));renderAdjustments();}catch(_){}};
  function emptyState(title,copy){return `<div class="empty-state"><span class="empty-icon">◌</span><strong>${esc(title)}</strong>${copy?`<p class="muted">${esc(copy)}</p>`:''}</div>`;}
  let confirmResolve=null;
  function confirmAction(title,message){$('confirmTitle').textContent=title;$('confirmMessage').textContent=message;$('confirmModal').classList.remove('hidden');return new Promise(resolve=>confirmResolve=resolve);}
  window.closeConfirm=value=>{ $('confirmModal').classList.add('hidden');if(confirmResolve){confirmResolve(value);confirmResolve=null;} };

  function tabs(){ return ['dashboard','products','inventory','costs','sales','settings'].map(tab=>`<button class="tab ${state.ownerTab===tab?'active':''}" onclick="showOwnerTab('${tab}')">${tab[0].toUpperCase()+tab.slice(1)}</button>`).join(''); }
  function renderOwner(){ const o=state.data.owner,m=o.metrics; $('ownerView').innerHTML=`<div class="section-head"><div><p class="eyebrow">OWNER CONTROL CENTER</p><h2>Business overview</h2></div></div><nav class="tabs">${tabs()}</nav><div id="ownerContent"></div>`; const content=$('ownerContent'); if(state.ownerTab==='dashboard') content.innerHTML=dashboardHtml(o); if(state.ownerTab==='products') content.innerHTML=productsHtml(o.products); if(state.ownerTab==='inventory') content.innerHTML=inventoryHtml(o.products); if(state.ownerTab==='costs') content.innerHTML=costsHtml(o.products); if(state.ownerTab==='sales') { content.innerHTML=salesHtml(); loadSales(); } if(state.ownerTab==='settings') content.innerHTML=settingsHtml(); }
  window.showOwnerTab=tab=>{ state.ownerTab=tab; renderOwner(); requestAnimationFrame(()=>{ const nav=document.querySelector('.tabs'),active=nav?.querySelector('.tab.active'); if(nav&&active) nav.scrollLeft=Math.max(0,active.offsetLeft-(nav.clientWidth-active.clientWidth)/2); }); };
  function dashboardHtml(o){ const m=o.metrics; return `<div class="metrics">${[['Current Inventory',m.currentInventory],['Units Sold',m.unitsSold],['Gross Sales Revenue',money(m.grossRevenue)],['Discounts Given',money(m.discounts)],['Estimated COGS',money(m.cogs)],['Estimated Gross Profit',money(m.grossProfit)]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>${inventoryTable(o.products)}`; }
  function inventoryTable(products){ return `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Size</th><th>Opening</th><th>Produced</th><th>Sold</th><th>Remaining</th><th>Price</th><th>Cost / Bag</th><th>Est. Profit / Bag</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(productLabel(p))}</td><td>${esc(sizeLabel(p)||'—')}</td><td>${p.starting}</td><td>${p.produced}</td><td>${p.sold}</td><td class="${p.current<=p.reorder?'low':''}">${p.current}${p.current<=p.reorder?' · LOW STOCK':''}</td><td>${money(p.price)}</td><td>${money(p.estimatedCost)}</td><td>${money(p.price-p.estimatedCost)}</td></tr>`).join('')}</tbody></table></div>`; }
  function productsHtml(products){ return `<div class="split"><form class="card" onsubmit="saveProductForm(event)"><h3>Add or update product</h3><input id="productId" type="hidden"><div class="form-grid"><div><label>Name</label><input id="productName" required maxlength="100"></div><div><label>Flavor / Variation</label><input id="productVariation" maxlength="100"></div><div><label>Package size (g)</label><input id="productSize" type="number" min="1" step="1" required></div><div><label>Price per bag</label><input id="productPrice" type="number" min="0" step="0.01" required></div><div><label>Status</label><select id="productActive"><option value="true">Active</option><option value="false">Inactive</option></select></div><div class="full"><label>Notes</label><textarea id="productNotes"></textarea></div></div><button class="primary wide">SAVE PRODUCT</button></form><div class="card"><h3>Products</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Size</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.variation)}</small></td><td>${esc(sizeLabel(p)||'—')}</td><td>${money(p.price)}</td><td>${p.active?'Active':'Inactive'}</td><td><button class="secondary" onclick="editProduct('${esc(p.id)}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div></div>`; }
  window.editProduct=id=>{ const p=state.data.owner.products.find(x=>x.id===id); $('productId').value=p.id;$('productName').value=p.name;$('productVariation').value=p.variation;$('productSize').value=p.packageSizeGrams;$('productPrice').value=p.price;$('productActive').value=String(p.active);$('productNotes').value=p.notes; window.scrollTo({top:0,behavior:'smooth'}); };
  window.saveProductForm=async e=>{ e.preventDefault(); const product={id:$('productId').value,name:$('productName').value,variation:$('productVariation').value,packageSizeGrams:$('productSize').value,price:$('productPrice').value,active:$('productActive').value==='true',notes:$('productNotes').value}; try{ const r=await action(()=>run('saveProduct',state.token,product)); toast(r.message); await refreshOwner(); }catch(_){} };
  function inventoryHtml(products){ return '<div class="card"><h3>Inventory controls</h3><p class="muted">Produced bags come from completed production batches. Use Stock Use for samples, damage, or corrections.</p>'+products.map(p=>`<details class="owner-record"><summary><span>${esc(productLabel(p))} · ${esc(sizeLabel(p)||'size not set')}</span><strong>${p.current} left</strong></summary><div class="summary-row"><span>Produced bags</span><strong>${p.produced}</strong></div><div class="form-grid"><div><label>Opening inventory</label><input id="start-${esc(p.id)}" type="number" min="0" value="${p.starting}"></div><div><label>Reorder level</label><input id="reorder-${esc(p.id)}" type="number" min="0" value="${p.reorder}"></div></div><button class="secondary wide" onclick="saveInventory('${esc(p.id)}')">Save inventory settings</button></details>`).join('')+'</div>'; }
  window.saveInventory=async id=>{ try{ await action(()=>run('updateInventory',state.token,id,{starting:$(`start-${id}`).value,reorder:$(`reorder-${id}`).value}),'Inventory settings updated.'); await refreshOwner(); }catch(_){} };
  function costsHtml(products){ return `<div class="split"><form class="card" onsubmit="submitCost(event)"><h3>Enter an expense</h3><div class="form-grid"><div><label>Date</label><input id="costDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div><label>Category</label><select id="costCategory">${['Product / chips','Labels','Plastic bags','Packaging','Shipping','Market / event fees','Marketing','Other materials','Miscellaneous'].map(v=>`<option>${v}</option>`).join('')}</select></div><div><label>Product (optional)</label><select id="costProduct">${optionList(products.map(productLabel),'General business expense')}</select></div><div><label>Total cost</label><input id="costTotal" type="number" min="0" step="0.01" required></div><div><label>Quantity associated</label><input id="costQty" type="number" min="0.01" step="0.01"></div><div><label>Description</label><input id="costDescription" required></div><div class="full"><label>Notes</label><textarea id="costNotes"></textarea></div></div><button class="primary wide">ADD COST</button></form><div class="card"><h3>Estimated finished bag costs</h3>${products.map(p=>`<details class="owner-record"><summary>${esc(productLabel(p))} · ${esc(sizeLabel(p)||'size not set')} · ${money(p.estimatedCost)}</summary><div class="form-grid"><div><label>Raw product</label><input id="raw-${esc(p.id)}" type="number" min="0" step=".01" value="${p.costParts.raw}"></div><div><label>Label</label><input id="label-${esc(p.id)}" type="number" min="0" step=".01" value="${p.costParts.label}"></div><div><label>Plastic bag</label><input id="bag-${esc(p.id)}" type="number" min="0" step=".01" value="${p.costParts.bag}"></div><div><label>Other packaging</label><input id="other-${esc(p.id)}" type="number" min="0" step=".01" value="${p.costParts.other}"></div></div><button class="secondary wide" onclick="saveProductCost('${esc(p.id)}')">SAVE · Current ${money(p.estimatedCost)}</button></details>`).join('')}</div></div><div class="card" style="margin-top:18px"><div class="section-head"><h3>Recent costs</h3><button class="secondary" onclick="loadCosts()">Refresh</button></div><div id="costRows" class="table-wrap"><p style="padding:12px">Choose Refresh to load expenses.</p></div></div>`; }
  window.submitCost=async e=>{ e.preventDefault(); try{ await action(()=>run('addCost',state.token,{date:$('costDate').value,category:$('costCategory').value,product:$('costProduct').value,total:$('costTotal').value,quantity:$('costQty').value,description:$('costDescription').value,notes:$('costNotes').value}),'Cost added.'); e.target.reset(); }catch(_){} };
  window.saveProductCost=async id=>{ try{ await action(()=>run('updateProductCost',state.token,id,{raw:$(`raw-${id}`).value,label:$(`label-${id}`).value,bag:$(`bag-${id}`).value,other:$(`other-${id}`).value}),'Product cost updated.'); await refreshOwner(); }catch(_){} };
  window.loadCosts=async()=>{ try{ const rows=await action(()=>run('getCostsForOwner',state.token)); $('costRows').innerHTML=`<table><thead><tr><th>Date</th><th>Category</th><th>Product</th><th>Description</th><th>Total</th><th>Qty</th><th>Cost / Unit</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.category)}</td><td>${esc(r.product||'General')}</td><td>${esc(r.description)}</td><td>${money(r.total)}</td><td>${r.quantity}</td><td>${r.quantity?money(r.unitCost):'—'}</td></tr>`).join('')}</tbody></table>`;}catch(_){} };
  function salesHtml(){ const p=state.data.owner.products,s=state.data.settings; return `<div class="card"><h3>Sales detail</h3><div class="filter-bar"><div><label>Seller</label><select id="filterSeller">${optionList(s.sellers,'All sellers')}</select></div><div><label>Product</label><select id="filterProduct"><option value="">All products</option>${p.map(x=>`<option value="${esc(x.id)}">${esc(productLabel(x))}</option>`).join('')}</select></div><div><label>From</label><input id="filterFrom" type="date"></div><div><label>To</label><input id="filterTo" type="date"></div><button class="primary" onclick="loadSales()">FILTER</button></div><div id="salesRows" class="table-wrap"></div></div>`; }
  window.loadSales=async()=>{ const filters={seller:$('filterSeller')?.value||'',product:$('filterProduct')?.value||'',from:$('filterFrom')?.value||'',to:$('filterTo')?.value||''}; try{ const rows=await action(()=>run('getSalesForOwner',state.token,filters)); $('salesRows').innerHTML=`<table><thead><tr><th>Sale</th><th>Date</th><th>Seller</th><th>Product</th><th>Size</th><th>Qty</th><th>Line</th><th>Discount</th><th>Sale Total</th><th>Payment</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.saleId)}</td><td>${r.date}<br><small>${esc(r.time)}</small></td><td>${esc(r.seller)}</td><td>${esc(r.product)}</td><td>${r.packageSizeGrams?`${r.packageSizeGrams} g`:'—'}</td><td>${r.quantity}</td><td>${money(r.lineSubtotal)}</td><td>${Math.round(r.discountPercent*100)}%</td><td>${money(r.finalTotal)}</td><td>${esc(r.paymentMethod)}</td></tr>`).join('')}</tbody></table>`;}catch(_){} };
  function settingsHtml(){ const s=state.data.settings,d=s.discounts; return `<form class="card" onsubmit="saveSettings(event)"><h3>Business settings</h3><div class="form-grid"><div><label>Business name</label><input id="setBusiness" value="${esc(s.businessName)}" required></div><div><label>Currency symbol</label><input id="setCurrency" value="${esc(s.currency)}" maxlength="5" required></div><div><label>Tier 1 quantity</label><input id="setT1Q" type="number" min="1" value="${d.tier1Quantity}" required></div><div><label>Tier 1 discount %</label><input id="setT1P" type="number" min="0" max="99" step=".01" value="${d.tier1Percent*100}" required></div><div><label>Tier 2 quantity</label><input id="setT2Q" type="number" min="2" value="${d.tier2Quantity}" required></div><div><label>Tier 2 discount %</label><input id="setT2P" type="number" min="0" max="99" step=".01" value="${d.tier2Percent*100}" required></div><div><label>Seller names (one per line)</label><textarea id="setSellers">${esc(s.sellers.join('\n'))}</textarea></div><div><label>Checkout payment methods</label><textarea id="setPayments">${esc(s.paymentMethods.join('\n'))}</textarea></div></div><button class="primary wide">SAVE SETTINGS</button></form><form class="card" style="margin-top:18px" onsubmit="savePins(event)"><h3>Change owner PIN</h3><p class="muted">Seller checkout is password-free. The owner PIN protects prices, inventory controls, costs, and settings.</p><div class="form-grid"><div><label>New owner PIN</label><input id="newOwnerPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required></div></div><button class="secondary wide">CHANGE OWNER PIN</button></form>`; }
  window.saveSettings=async e=>{ e.preventDefault(); const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean); try{ state.data.settings=await action(()=>run('updateSettings',state.token,{businessName:$('setBusiness').value,currency:$('setCurrency').value,tier1Quantity:$('setT1Q').value,tier1Percent:$('setT1P').value,tier2Quantity:$('setT2Q').value,tier2Percent:$('setT2P').value,sellers:lines('setSellers'),paymentMethods:lines('setPayments')}),'Settings saved.'); $('businessName').textContent=state.data.settings.businessName; renderOwner(); }catch(_){} };
  window.savePins=async e=>{ e.preventDefault(); try{ await action(()=>run('changeOwnerPin',state.token,$('newOwnerPin').value),'Owner PIN changed.'); e.target.reset(); }catch(_){} };
  async function refreshOwner(){ state.data=await action(()=>run('getAppBootstrap',state.token)); renderOwner(); }
  async function renderCaja(){
    $('sellerContent').innerHTML=`<div class="section-head"><div><p class="eyebrow">CASH DRAWER</p><h2>Caja</h2></div><button class="secondary" onclick="renderCaja()">Refresh</button></div>${emptyState('Loading cash drawer…','')}`;
    try {
      state.drawer=await action(()=>run('getCashDrawer',state.token));
      if(state.sellerTab==='caja') drawCaja();
    } catch(_) {}
  }
  function drawCaja(){
    const drawer=state.drawer;
    const counted=drawer.latestCount?.amount;
    $('sellerContent').innerHTML=`<div class="section-head"><div><p class="eyebrow">CASH DRAWER · ${esc(drawer.date)}</p><h2>Caja</h2></div><button class="secondary" onclick="renderCaja()">Refresh</button></div>
      <div class="caja-layout"><section><div class="cash-expected"><span>Cash expected in drawer</span><strong>${money(drawer.expected)}</strong><small>Cash only · excludes Zelle & Cash App</small></div>
      <div class="card"><div class="summary-row"><span>Opening cash</span><strong>${money(drawer.opening)}</strong></div><div class="summary-row"><span>Cash sales, after discounts</span><strong>${money(drawer.cashSales)}</strong></div><div class="summary-row"><span>Cash in / out</span><strong>${drawer.netMovements<0?'−':''}${money(Math.abs(drawer.netMovements))}</strong></div>
      <details><summary>Set opening cash</summary><form onsubmit="saveDrawerOpening(event)"><label for="drawerOpening">Cash at start of day</label><input id="drawerOpening" type="number" inputmode="decimal" min="0" step="0.01" value="${drawer.opening}" required><button class="secondary wide">Save opening cash</button></form></details></div>
      <form class="card cash-count" onsubmit="saveDrawerCount(event)"><h3>Count the drawer</h3><label for="drawerCounted">Cash you actually have</label><input id="drawerCounted" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${counted==null?'':counted}" oninput="countDrawer(this.value)" required><p id="drawerDifference" aria-live="polite"></p><button class="secondary wide">Save cash count</button>${drawer.latestCount?`<small class="muted">Last saved ${esc(drawer.latestCount.time)} by ${esc(drawer.latestCount.seller)}</small>`:''}</form></section>
      <section><form class="card" onsubmit="addDrawerMovement(event)"><h3>Money in / out</h3><div class="form-grid"><div><label for="drawerDirection">Movement</label><select id="drawerDirection"><option value="in">Cash in (+)</option><option value="out">Cash out (−)</option></select></div><div><label for="drawerAmount">Amount</label><input id="drawerAmount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00"></div></div><label for="drawerReason">Reason</label><input id="drawerReason" required maxlength="120" placeholder="Extra change, supplies, bank deposit…"><button class="primary wide">Record movement</button></form><div class="card"><h3>Drawer activity</h3><div id="drawerActivity">${drawer.activity.length?drawer.activity.map(m=>`<div class="cart-line"><span>${esc(m.reason)}<small>${esc(m.time)} · ${esc(m.seller)}</small></span><strong>${m.amount>0?'+':'−'}${money(Math.abs(m.amount))}</strong></div>`).join(''):'<p class="muted">No cash movements recorded today.</p>'}</div></div></section></div>`;
    countDrawer(counted==null?'':counted);
  }
  window.countDrawer=value=>{const el=$('drawerDifference');if(!el)return;if(value===''||!Number.isFinite(Number(value))||Number(value)<0){el.textContent='Enter your count to check the balance.';el.className='';return;}const difference=Math.round((Number(value)-state.drawer.expected)*100)/100;el.textContent=difference===0?'Balanced · cash matches':difference>0?money(difference)+' over expected':money(-difference)+' short';el.className=difference===0?'cash-balanced':'cash-mismatch';};
  window.saveDrawerOpening=async e=>{e.preventDefault();try{state.drawer=await action(()=>run('setCashDrawerOpening',state.token,$('drawerOpening').value,state.sellerName));drawCaja();toast('Opening cash saved.');}catch(_) {}};
  window.saveDrawerCount=async e=>{e.preventDefault();try{state.drawer=await action(()=>run('recordCashCount',state.token,$('drawerCounted').value,state.sellerName));drawCaja();toast('Cash count saved.');}catch(_) {}};
  window.addDrawerMovement=async e=>{e.preventDefault();const request={seller:state.sellerName,direction:$('drawerDirection').value,amount:$('drawerAmount').value,reason:$('drawerReason').value};try{state.drawer=await action(()=>run('recordCashMovement',state.token,request));drawCaja();toast('Cash movement recorded.');}catch(_) {}};
  init();
})();
</script>
