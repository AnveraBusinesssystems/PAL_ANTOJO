<style>
  :root {
    --cream:#f7f3e9; --paper:#fffefa; --ink:#142219; --muted:#6e756f;
    --forest:#123e28; --forest-2:#1e5a39; --orange:#c85422; --gold:#d49b32;
    --sage:#e8efe5; --danger:#a83b32; --danger-soft:#f9e7e3; --line:#e6dece;
    --shadow:0 18px 50px rgba(24,49,32,.10); --shadow-sm:0 7px 22px rgba(24,49,32,.07);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; min-height:100vh; overflow-x:hidden; background:#f7f3e9; color:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent; }
  button,input,select,textarea { font:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.48; cursor:not-allowed; }
  .hidden { display:none !important; }
  .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
  h1,h2,h3 { font-family:Georgia,"Times New Roman",serif; margin:0; }
  h2 { font-size:clamp(27px,4vw,40px); line-height:1.05; letter-spacing:-.02em; }
  h3 { font-size:20px; }
  .eyebrow { margin:0 0 7px; color:var(--orange); font-size:10px; font-weight:900; letter-spacing:.18em; }
  .muted { color:var(--muted); }
  label { display:block; margin:14px 0 6px; color:#344239; font-size:12px; font-weight:800; }
  input,select,textarea { width:100%; min-height:48px; border:1px solid var(--line); border-radius:13px; padding:11px 13px; color:var(--ink); background:#fff; }
  textarea { min-height:82px; resize:vertical; }
  input:focus,select:focus,textarea:focus { outline:3px solid rgba(212,155,50,.20); border-color:var(--gold); }
  button { min-height:44px; border:0; border-radius:12px; padding:10px 16px; font-weight:850; }
  .primary { background:linear-gradient(135deg,var(--forest),var(--forest-2)); color:#fff; box-shadow:0 8px 18px rgba(18,62,40,.18); }
  .primary:hover { filter:brightness(1.07); }
  .secondary { background:#f1eadb; color:var(--forest); }
  .danger { background:var(--danger-soft); color:var(--danger); }
  .danger-solid { background:var(--danger); color:#fff; }
  .wide { width:100%; margin-top:17px; }
  .link-button { min-height:auto; padding:7px 9px; background:transparent; color:var(--forest); }

  .topbar { position:sticky; z-index:30; top:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px clamp(14px,4vw,44px); background:rgba(250,247,239,.92); border-bottom:1px solid rgba(222,212,194,.8); backdrop-filter:blur(16px); }
  .brand-lockup,.top-actions { display:flex; align-items:center; }
  .brand-lockup .mini-logo { width:44px; height:44px; margin-right:10px; border-radius:50%; object-fit:contain; background:#fff; }
  .brand-lockup strong,.brand-lockup small { display:block; }
  .brand-lockup strong { letter-spacing:.035em; }
  .brand-lockup small { margin-top:2px; color:var(--muted); font-size:11px; }
  .badge { margin-right:4px; border-radius:999px; padding:5px 9px; background:var(--sage); color:var(--forest); font-size:10px; font-weight:900; letter-spacing:.1em; }
  .page { width:min(1240px,100%); margin:auto; padding:25px clamp(14px,4vw,40px) 96px; }
  .section-head { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:18px; }
  .section-copy { max-width:650px; }
  .section-copy .muted { margin:8px 0 0; line-height:1.45; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:19px; box-shadow:var(--shadow-sm); }

  .seller-nav { display:flex; gap:8px; margin-bottom:22px; padding:5px; overflow-x:auto; border:1px solid var(--line); border-radius:15px; background:rgba(255,254,250,.75); }
  .seller-nav button { flex:1; min-width:132px; background:transparent; color:var(--muted); }
  .seller-nav button.active { background:var(--forest); color:#fff; box-shadow:0 6px 14px rgba(18,62,40,.16); }
  .seller-nav .nav-icon { margin-right:6px; font-size:16px; }
  .seller-header-tools { display:flex; min-width:220px; gap:9px; align-items:end; }
  .seller-header-tools>div { flex:1; }
  .seller-header-tools label { margin-top:0; }
  .seller-layout { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(310px,.72fr); gap:20px; align-items:start; }
  .seller-layout>*,.split>*,.adjustment-layout>* { min-width:0; }
  .product-toolbar { display:flex; gap:10px; margin-bottom:13px; }
  .product-toolbar input { padding-left:14px; }
  .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .product-card { position:relative; overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 5px 16px rgba(24,49,32,.045); transition:.18s ease; }
  .product-card:hover { transform:translateY(-2px); border-color:#cfc2aa; box-shadow:var(--shadow-sm); }
  .product-card.selected { border-color:var(--gold); box-shadow:0 0 0 2px rgba(212,155,50,.18); }
  .product-card.sold-out { opacity:.62; }
  .product-card h3 { padding-right:46px; font-size:21px; }
  .flavor { min-height:20px; margin:4px 0 11px; color:var(--muted); font-size:13px; }
  .stock-pill { position:absolute; right:14px; top:14px; border-radius:999px; padding:4px 8px; background:var(--sage); color:var(--forest); font-size:10px; font-weight:900; }
  .stock-pill.low { background:var(--danger-soft); color:var(--danger); }
  .product-meta { display:flex; justify-content:space-between; align-items:center; margin:8px 0 14px; color:var(--muted); font-size:12px; }
  .price { color:var(--orange); font-size:20px; font-weight:900; }
  .qty { display:grid; grid-template-columns:48px 1fr 48px; align-items:center; gap:8px; text-align:center; }
  .qty button { padding:0; background:var(--sage); color:var(--forest); border:1px solid #d4dfd0; font-size:23px; }
  .qty strong { font-size:22px; }
  .checkout { position:sticky; top:80px; }
  .mobile-cart-bar { display:none; }
  .checkout-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cart-count { border-radius:999px; padding:5px 9px; background:#f3ead5; color:#725213; font-size:11px; font-weight:900; }
  .empty-cart { padding:24px 10px; color:var(--muted); text-align:center; }
  .cart-lines { margin:2px 0 10px; border-bottom:1px solid var(--line); }
  .cart-line { display:grid; grid-template-columns:1fr auto; gap:12px; padding:8px 0; font-size:13px; }
  .cart-line small { display:block; margin-top:2px; color:var(--muted); }
  .summary-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
  .summary-row.discount { color:var(--forest-2); }
  .grand-total { margin-top:7px; padding-top:14px; border-top:1px solid var(--line); font-size:27px; font-weight:900; }
  .upsell { margin:12px 0; min-height:42px; padding:10px 11px; border-radius:11px; background:#fff3d9; color:#725213; font-size:12px; font-weight:800; }
  .payment-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .payment-option input { position:absolute; opacity:0; pointer-events:none; }
  .payment-option span { display:grid; place-items:center; min-height:49px; border:1px solid var(--line); border-radius:12px; background:#fff; color:#4b554e; font-size:12px; font-weight:850; cursor:pointer; }
  .payment-option input:checked+span { border-color:var(--forest); background:var(--forest); color:#fff; box-shadow:0 6px 14px rgba(18,62,40,.17); }
  .editing-banner { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:13px; padding:12px 14px; border-radius:13px; background:#fff3d9; color:#725213; font-size:13px; font-weight:800; }

  .inventory-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .inventory-card { padding:17px; }
  .inventory-card .inventory-number { margin:14px 0 4px; color:var(--forest); font-family:Georgia,serif; font-size:38px; line-height:1; }
  .inventory-card .inventory-foot { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
  .status-line { height:5px; margin-top:14px; border-radius:10px; background:#d9e7d3; }
  .status-line.low { background:#e8a095; }
  .transaction-list { display:grid; gap:10px; }
  .transaction-card { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; padding:16px 17px; }
  .transaction-card h3 { font-family:inherit; font-size:15px; }
  .transaction-meta { display:flex; flex-wrap:wrap; gap:6px 12px; margin:5px 0 8px; color:var(--muted); font-size:12px; }
  .transaction-items { color:#364039; font-size:13px; }
  .transaction-total { text-align:right; }
  .transaction-total strong { display:block; margin-bottom:7px; color:var(--forest); font-size:21px; }
  .empty-state { padding:44px 20px; text-align:center; }
  .empty-state .empty-icon { display:block; margin-bottom:12px; font-size:34px; }
  .adjustment-layout { display:grid; grid-template-columns:minmax(290px,.8fr) minmax(0,1.2fr); gap:18px; }
  .reason-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .reason-option input { position:absolute; opacity:0; }
  .reason-option span { display:grid; place-items:center; min-height:72px; border:1px solid var(--line); border-radius:13px; padding:8px; background:#fff; text-align:center; font-size:12px; font-weight:800; cursor:pointer; }
  .reason-option input:checked+span { border-color:var(--orange); background:#fff0e8; color:#8b3818; }

  .tabs { display:flex; gap:7px; overflow-x:auto; padding:3px 0 16px; }
  .tab { white-space:nowrap; background:#f1eadb; color:var(--forest); }
  .tab.active { background:var(--forest); color:#fff; }
  .metrics { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:20px; }
  .metric { background:#fff; border:1px solid var(--line); padding:14px; border-radius:15px; }
  .metric small { display:block; min-height:34px; color:var(--muted); }
  .metric strong { display:block; margin-top:4px; font-size:22px; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:#fff; }
  table { width:100%; border-collapse:collapse; min-width:760px; }
  th,td { padding:11px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; font-size:13px; }
  th { position:sticky; top:0; background:#edf2e8; color:var(--forest); }
  .low { color:var(--danger); font-weight:900; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 14px; }
  .form-grid .full { grid-column:1/-1; }
  .inline-actions { display:flex; gap:7px; flex-wrap:wrap; }
  .inline-actions button { min-height:34px; padding:6px 10px; font-size:12px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .filter-bar { display:grid; grid-template-columns:repeat(4,1fr) auto; gap:8px; align-items:end; margin-bottom:12px; }
  .filter-bar label { margin-top:0; }

  .modal { position:fixed; z-index:120; inset:0; display:grid; place-items:center; padding:18px; background:rgba(13,31,20,.55); backdrop-filter:blur(7px); }
  .modal-card { position:relative; width:min(100%,430px); padding:28px; border:1px solid rgba(255,255,255,.35); border-radius:23px; background:var(--paper); box-shadow:var(--shadow); }
  .modal-card.compact { width:min(100%,390px); }
  .modal-close { position:absolute; right:13px; top:11px; min-height:36px; padding:2px 10px; background:transparent; color:var(--muted); font-size:26px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .toast { position:fixed; z-index:150; left:50%; top:18px; max-width:90%; padding:12px 18px; border-radius:12px; background:var(--forest); color:#fff; box-shadow:var(--shadow); opacity:0; transform:translate(-50%,-130%); transition:.25s; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.error { background:var(--danger); }
  .loading { position:fixed; z-index:140; inset:0; display:grid; place-content:center; justify-items:center; gap:11px; background:rgba(250,247,239,.78); backdrop-filter:blur(4px); font-weight:800; }
  .spinner { width:38px; height:38px; border:4px solid #e6ddcc; border-top-color:var(--orange); border-radius:50%; animation:spin .8s linear infinite; }
  body * { border-radius:0 !important; }
  .mini-logo,.spinner { border-radius:50% !important; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media(max-width:940px) {
    .metrics { grid-template-columns:repeat(3,1fr); }
    .seller-layout,.split,.adjustment-layout { grid-template-columns:1fr; }
    .checkout { position:static; }
  }
  @media(max-width:620px) {
    body { background:#fbf9f3; }
    .page { padding:18px 12px calc(152px + env(safe-area-inset-bottom)); }
    .topbar { min-height:62px; align-items:center; padding:8px 12px; background:#fbf9f3; }
    .top-actions { flex-wrap:nowrap; justify-content:flex-end; }
    .badge { display:none; }
    .brand-lockup strong { font-size:14px; }
    .brand-lockup small { font-size:10px; }
    .brand-lockup .mini-logo { width:38px; height:38px; }
    .top-actions .link-button { min-height:44px; padding:8px 4px; font-size:12px; }
    .section-head { align-items:stretch; flex-direction:column; }
    .section-head h2 { font-size:31px; }
    .section-copy .muted { font-size:14px; }
    .seller-header-tools { min-width:0; }
    .seller-nav { position:fixed; z-index:70; left:0; right:0; bottom:0; height:calc(68px + env(safe-area-inset-bottom)); margin:0; padding:0 4px env(safe-area-inset-bottom); gap:0; border:0; border-top:1px solid var(--line); background:#fffefa; box-shadow:0 -8px 24px rgba(24,49,32,.09); overflow:visible; }
    .seller-nav button { min-width:0; min-height:68px; padding:8px 2px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; font-size:10px; letter-spacing:.01em; }
    .seller-nav .nav-icon { margin:0; font-size:20px; line-height:1; }
    .seller-nav button.active { box-shadow:inset 0 3px 0 var(--orange); background:#eef3eb; color:var(--forest); }
    .mobile-cart-bar { position:fixed; z-index:65; display:flex; left:10px; right:10px; bottom:calc(76px + env(safe-area-inset-bottom)); min-height:58px; justify-content:space-between; align-items:center; padding:10px 14px; border:1px solid #082d1a; background:var(--forest); color:#fff; box-shadow:0 8px 28px rgba(18,62,40,.24); }
    .mobile-cart-bar span { display:block; color:#dce8df; font-size:11px; font-weight:700; }
    .mobile-cart-bar strong { display:block; margin-top:2px; font-size:17px; }
    .mobile-cart-bar b { font-size:18px; }
    .editing-banner { align-items:flex-start; }
    .product-grid { grid-template-columns:1fr; }
    .product-card { padding:15px 14px; box-shadow:none; border-color:#d9d0bf; }
    .product-card:hover { transform:none; }
    .product-card h3 { font-size:20px; }
    .qty { grid-template-columns:54px 1fr 54px; }
    .qty button { min-height:48px; }
    .checkout { scroll-margin-top:76px; padding:17px 14px; border-top:4px solid var(--forest); }
    .payment-option span { min-height:54px; padding:7px 2px; }
    .inventory-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .inventory-card { min-width:0; padding:14px 12px; box-shadow:none; }
    .inventory-card h3 { font-size:17px; }
    .inventory-card .inventory-number { font-size:34px; }
    .inventory-card .inventory-foot { display:block; }
    .inventory-card .inventory-foot strong { display:block; margin-top:4px; }
    .transaction-card { grid-template-columns:1fr; }
    .transaction-card { padding:14px; box-shadow:none; }
    .transaction-total { display:flex; justify-content:space-between; align-items:center; text-align:left; }
    .transaction-total strong { margin:0; }
    .transaction-total .inline-actions { justify-content:flex-end; }
    .metrics { grid-template-columns:repeat(2,1fr); }
    .metric { min-width:0; padding:12px; }
    .metric strong { font-size:19px; overflow-wrap:anywhere; }
    .form-grid,.filter-bar { grid-template-columns:1fr; }
    .card { padding:16px 14px; box-shadow:none; }
    .card,.split,.owner-page,#ownerContent { width:100%; max-width:100%; min-width:0; }
    .tabs { position:sticky; z-index:25; top:62px; margin:0 -12px 16px; padding:0 12px 9px; background:#fbf9f3; border-bottom:1px solid var(--line); }
    .tab { min-height:44px; }
    .table-wrap { margin-left:-14px; margin-right:-14px; border-left:0; border-right:0; -webkit-overflow-scrolling:touch; }
    table { min-width:700px; }
    th,td { padding:10px 9px; }
    td input,td select { min-width:92px; }
    .inline-actions button { min-height:42px; }
    .filter-bar>button { min-height:50px; }
    .modal { align-items:end; padding:0; }
    .modal-card,.modal-card.compact { width:100%; max-height:92dvh; overflow:auto; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); border-left:0; border-right:0; border-bottom:0; }
    .modal-close { min-width:44px; min-height:44px; }
    .toast { top:auto; bottom:calc(82px + env(safe-area-inset-bottom)); width:calc(100% - 20px); text-align:center; transform:translate(-50%,130%); }
    .toast.show { transform:translate(-50%,0); }
  }
  @media(max-width:390px) {
    .inventory-grid { grid-template-columns:1fr; }
    .payment-grid,.reason-grid { grid-template-columns:1fr; }
    .seller-header-tools { flex-direction:column; align-items:stretch; }
  }
  /* Compact operational layout: preserve touch areas, remove decorative space. */
  h2,h3 { font-family:inherit; letter-spacing:-.025em; }
  h2,.section-head h2 { font-size:25px; line-height:1.2; }
  h3 { font-size:16px; }
  .page { max-width:1440px; padding-top:16px; }
  .section-head { margin-bottom:12px; gap:10px; }
  .section-copy>.muted { display:none; }
  .eyebrow { font-size:9px; margin-bottom:4px; }
  .seller-nav { padding:0; gap:0; margin-bottom:16px; box-shadow:none; }
  .seller-nav button.active,.primary { box-shadow:none; }
  .card,.product-card { box-shadow:none; }
  .seller-layout { grid-template-columns:minmax(0,1fr) 340px; gap:20px; }
  .product-grid { display:block; border-top:1px solid var(--line); }
  .product-card { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:'name qty' 'flavor qty' 'meta qty'; gap:2px 12px; padding:12px; border:0; border-bottom:1px solid var(--line); min-height:84px; }
  .product-card:hover { transform:none; box-shadow:none; background:#faf9f4; }
  .product-card.selected { box-shadow:inset 3px 0 var(--forest); background:#edf3e9; border-color:var(--line); }
  .product-card h3 { grid-area:name; padding:0; font-size:15px; line-height:1.25; }
  .product-card .flavor { grid-area:flavor; margin:0; min-height:0; font-size:12px; }
  .product-card .product-meta { grid-area:meta; justify-content:flex-start; gap:10px; margin:3px 0 0; }
  .product-meta .price { font-size:14px; color:var(--ink); }
  .product-card .stock-pill { display:none; }
  .product-card .qty { grid-area:qty; grid-template-columns:44px 38px 44px; gap:0; align-self:center; }
  .qty button { min-height:44px; background:#fff; font-size:21px; }
  .qty strong { font-size:16px; }
  .checkout { top:82px; padding:16px; }
  .checkout h3 { font-size:17px; }
  .checkout textarea { min-height:48px; }
  .checkout details { margin-top:10px; }
  summary { cursor:pointer; min-height:44px; padding:12px 0; font-size:13px; font-weight:700; }
  .inventory-grid { display:block; border-top:1px solid var(--line); }
  .inventory-card { display:grid; grid-template-columns:minmax(0,1fr) 70px 130px; grid-template-areas:'name count price' 'flavor count price'; padding:12px; border:0; border-bottom:1px solid var(--line); gap:3px 10px; }
  .inventory-card h3 { grid-area:name; font-size:15px; }
  .inventory-card .flavor { grid-area:flavor; margin:0; min-height:0; font-size:12px; }
  .inventory-card .inventory-number { grid-area:count; font:700 21px inherit; margin:0; align-self:center; text-align:right; }
  .inventory-card .inventory-foot { grid-area:price; align-self:center; text-align:right; display:block; }
  .inventory-foot strong { display:block; margin-top:3px; }
  .inventory-card .status-line { display:none; }
  .transaction-list { gap:0; }
  .transaction-card { border-width:0 0 1px; padding:12px 0; }
  .transaction-card h3 { font-size:13px; overflow-wrap:anywhere; }
  .reason-option span { min-height:44px; }
  .metric { border-width:0 0 2px; padding:10px; }
  .metric small { min-height:28px; font-size:11px; }
  .metric strong { font-size:21px; }
  .owner-record { border-bottom:1px solid var(--line); padding:0 10px; }
  .owner-record>summary { display:flex; justify-content:space-between; gap:12px; }
  .owner-record>summary::after { content:'+'; }
  .owner-record[open]>summary::after { content:'−'; }
  .owner-record[open] { background:#f7f8f3; padding-bottom:12px; }
  .owner-record .form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .owner-record .inline-actions { margin-top:10px; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:3px; }
  .payment-option,.reason-option { position:relative; }
  .payment-option input,.reason-option input { width:1px; height:1px; min-height:0; padding:0; margin:0; border:0; overflow:hidden; }
